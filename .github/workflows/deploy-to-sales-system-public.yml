name: Deploy to sales_system_public

on:
  push:
    branches:
      - main

jobs:
  build-and-sync-to-sales-system-public:
    name: Build and Sync to sales_system_public
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare deploy artifact
        run: |
          mkdir deploy
          cp -R .next/standalone/* deploy/
          mkdir -p deploy/.next
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public

      - name: Checkout sales_system_public repository
        uses: actions/checkout@v4
        with:
          repository: y55y/sales_system_public
          token: ${{ secrets.CRM_ACTION_BUILDER }}
          path: sales_system_public

      - name: Sync build contents into sales_system_public
        run: |
          rm -rf sales_system_public/* sales_system_public/.next
          cp -R deploy/* sales_system_public/
          cp -R deploy/.next sales_system_public/.next

      - name: Commit and push changes to sales_system_public
        run: |
          cd sales_system_public
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy build from marketplace (${GITHUB_SHA})" || echo "No changes to commit"
          git push origin HEAD:main
        env:
          GITHUB_SHA: ${{ github.sha }}
